name: CI Pipeline

on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linting tools
        run: pip install flake8 bandit

      - name: Run flake8
        run: flake8 app/

      - name: Run bandit
        run: bandit -r app/ -ll

      - name: Run unit tests
        run: pytest tests/test_tasks.py -v

      - name: Prepare Firebase credentials for integration tests
        run: printf '%s' '${{ secrets.FIREBASE_CREDENTIALS_JSON }}' > firebase-credentials.json

      - name: Run integration tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json
        run: pytest tests/integration -v

      - name: Log in to GitHub Container Registry
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository }}:latest