name: CI Pipeline

on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linting tools
        run: pip install flake8 bandit

      - name: Run flake8
        run: flake8 app/

      - name: Run bandit
        run: bandit -r app/ -ll

      - name: Run unit tests
        run: pytest tests/test_tasks.py -v

      - name: Prepare Firebase credentials for integration tests
        run: printf '%s' '${{ secrets.FIREBASE_CREDENTIALS_JSON }}' > firebase-credentials.json

      - name: Run integration tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json
        run: pytest tests/integration -v

      - name: Log in to GitHub Container Registry
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskmind-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/taskmind-api:${{ github.sha }} \
            -t southamerica-east1-docker.pkg.dev/taskmind-500207/taskmind/taskmind-api:v1 \
            .

      - name: Validate Docker image with smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /workspace/firebase-credentials.json
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f taskmind-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker rm -f taskmind-smoke >/dev/null 2>&1 || true
          docker run -d \
            --name taskmind-smoke \
            -p 8000:8000 \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -e GOOGLE_APPLICATION_CREDENTIALS="${GOOGLE_APPLICATION_CREDENTIALS}" \
            -v "$PWD/firebase-credentials.json:/workspace/firebase-credentials.json:ro" \
            ghcr.io/${{ github.repository_owner }}/taskmind-api:latest
          echo "Waiting for the application to start..."
          sleep 10
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskmind-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskmind-api:${{ github.sha }}

      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          echo "$GCP_SA_KEY" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project taskmind-500207

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Push Docker image to Artifact Registry
        run: |
          docker push southamerica-east1-docker.pkg.dev/taskmind-500207/taskmind/taskmind-api:v1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy taskmind-api \
            --image=southamerica-east1-docker.pkg.dev/taskmind-500207/taskmind/taskmind-api:v1 \
            --region=southamerica-east1 \
            --platform=managed \
            --quiet