version: "3.9"

services:
  taskmind-api:
    container_name: taskmind-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - taskmind-network

  notification-service:
    container_name: notification-service
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    networks:
      - taskmind-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - taskmind-api
    networks:
      - taskmind-network

networks:
  taskmind-network:
    driver: bridge
